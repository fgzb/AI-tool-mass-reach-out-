# Runs the agent 24/7 and restarts it after a crash or a reboot.
#   docker compose up -d --build     start (rehearsal: nothing is sent, previews go to outbox/)
#   docker compose logs -f           follow what it does
# When the previews look right, change the command below to add "--live", then `docker compose up -d`.
services:
  agent:
    build: .
    restart: unless-stopped
    command: ["fr-outreach", "agent"]
    # command: ["fr-outreach", "agent", "--live"]
    env_file: .env
    environment:
      TZ: Europe/Paris
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./templates:/app/templates:ro
      - ./data:/app/data
      - ./outbox:/app/outbox
