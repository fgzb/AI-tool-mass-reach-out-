# Copy to config.yaml and adapt. Secrets are read from environment variables, never from this file.
database: data/outreach.sqlite

http:
  # Identify your crawler honestly, with a way to reach you.
  user_agent: "MaSocieteBot/1.0 (+https://www.ma-societe.fr/bot ; contact@ma-societe.fr)"
  timeout: 15
  per_host_delay: 1.0          # seconds between two requests to the same website
  respect_robots_txt: true
  workers: 8

# What to look for (all filters optional, combined with AND).
search:
  query: ""                    # free text, e.g. "logiciel" or "menuiserie"
  categories: [PME, ETI]       # INSEE catégorie d'entreprise: PME, ETI, GE
  departments: ["69", "38"]    # splits the API search per department (avoids the 10 000 results cap)
  regions: []                  # INSEE region codes (used when departments is empty), e.g. "84"
  postal_codes: []
  naf_codes: []                # e.g. ["62.01Z", "62.02A"]
  naf_sections: []             # e.g. ["C", "J", "M"]
  headcount_bands: ["11", "12", "21", "22", "31", "32"]   # 10 to 499 employees
  revenue_min: null            # EUR (API: last published accounts only)
  revenue_max: null
  exclude_individual: true     # skip sole traders (entrepreneurs individuels)
  max_results: 500

discovery:
  search_provider: null        # "brave" to use the Brave Search API (env BRAVE_API_KEY)
  brave_api_key_env: BRAVE_API_KEY
  guess_domains: true          # try <name>.fr / <name>.com
  min_confidence: 50           # 0-100; the SIREN found on the site gives 70 points

scraping:
  max_pages_per_site: 6
  max_emails_per_company: 1    # contact one address per company
  check_mx: true

pappers:
  api_token_env: PAPPERS_API_TOKEN

mail:
  campaign: "2026-10-premier-contact"
  template: templates/prospection_fr.txt
  from_name: "Prénom Nom - Ma Société"
  from_address: "prenom.nom@ma-societe.fr"
  reply_to: ""
  # Mandatory sender identification + opt-out (the tool refuses to send without them).
  company_legal_name: "Ma Société SAS"
  company_address: "1 rue de l'Exemple, 69001 Lyon"
  unsubscribe_mailto: "desinscription@ma-societe.fr"
  unsubscribe_url: ""
  data_source_notice: >-
    Vos coordonnées professionnelles ont été collectées à partir du registre public des
    entreprises (INSEE/SIRENE) et de votre site internet.
  smtp:
    host: smtp.ma-societe.fr
    port: 587
    security: starttls         # starttls | ssl | none
    username_env: SMTP_USERNAME
    password_env: SMTP_PASSWORD
  imap:
    host: imap.ma-societe.fr
    port: 993
    username_env: IMAP_USERNAME
    password_env: IMAP_PASSWORD
    folder: INBOX
  delay_seconds: 20            # pacing between two e-mails
  jitter_seconds: 10
  max_per_run: 50
  max_per_day: 200             # keep volumes low on a fresh domain to protect deliverability
  outbox_dir: outbox
